<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#E5DFC9" />
    </linearGradient>
    <linearGradient id="woodSlats" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88E67" />
      <stop offset="50%" stop-color="#9C724C" />
      <stop offset="100%" stop-color="#885E38" />
    </linearGradient>
    <linearGradient id="concreteFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6CEBE" />
      <stop offset="100%" stop-color="#B8AF9F" />
    </linearGradient>
    <linearGradient id="ambientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Plaster Wall -->
  <rect width="600" height="450" fill="url(#wallTone)" />

  <!-- Floor Plane (Polished Concrete) -->
  <polygon points="0,320 600,280 600,450 0,450" fill="url(#concreteFloor)" />

  <!-- Recessed Architectural Corridor Niche -->
  <polygon points="120,40 380,40 380,305 120,320" fill="#DDD7CB" />
  <polygon points="380,40 430,70 430,290 380,305" fill="#CCC5B6" />

  <!-- Natural Timber Slatted Wall Panel (Left Feature) -->
  <g fill="url(#woodSlats)">
    <rect x="140" y="55" width="10" height="255" rx="1.5" />
    <rect x="158" y="55" width="10" height="255" rx="1.5" />
    <rect x="176" y="55" width="10" height="255" rx="1.5" />
    <rect x="194" y="55" width="10" height="255" rx="1.5" />
    <rect x="212" y="55" width="10" height="255" rx="1.5" />
    <rect x="230" y="55" width="10" height="255" rx="1.5" />
    <rect x="248" y="55" width="10" height="255" rx="1.5" />
    <rect x="266" y="55" width="10" height="255" rx="1.5" />
    <rect x="284" y="55" width="10" height="255" rx="1.5" />
    <rect x="302" y="55" width="10" height="255" rx="1.5" />
    <rect x="320" y="55" width="10" height="255" rx="1.5" />
    <rect x="338" y="55" width="10" height="255" rx="1.5" />
    <rect x="356" y="55" width="10" height="255" rx="1.5" />
  </g>

  <!-- Minimalist Brass Fixture & Clean Architectural Lines -->
  <rect x="460" y="140" width="8" height="60" rx="3" fill="#D4AF37" opacity="0.9" />
  <circle cx="464" cy="170" r="16" fill="#D4AF37" opacity="0.2" />

  <!-- Fluted Stone / Ceramic Planter in Corridor Corner -->
  <path d="M420 250 L470 250 L460 360 L430 360 Z" fill="#E8E4DA" stroke="#C4BEB0" stroke-width="1.5" />
  <!-- Fluting lines -->
  <line x1="432" y1="250" x2="438" y2="360" stroke="#C8C2B4" stroke-width="1" />
  <line x1="445" y1="250" x2="445" y2="360" stroke="#C8C2B4" stroke-width="1" />
  <line x1="458" y1="250" x2="452" y2="360" stroke="#C8C2B4" stroke-width="1" />

  <!-- Botanical Olive Stem in Planter -->
  <path d="M445 250 Q430 180 405 130" stroke="#52634C" stroke-width="2.5" fill="none" />
  <path d="M445 250 Q460 170 485 110" stroke="#52634C" stroke-width="2.5" fill="none" />

  <ellipse cx="410" cy="140" rx="12" ry="6" fill="#6B7E64" transform="rotate(-30 410 140)" />
  <ellipse cx="430" cy="170" rx="12" ry="6" fill="#5F7258" transform="rotate(-20 430 170)" />
  <ellipse cx="475" cy="130" rx="14" ry="6" fill="#6B7E64" transform="rotate(35 475 130)" />
  <ellipse cx="460" cy="165" rx="13" ry="6" fill="#5A6D53" transform="rotate(25 460 165)" />
  <ellipse cx="485" cy="110" rx="11" ry="5" fill="#75886E" transform="rotate(45 485 110)" />

  <!-- Soft Sunlight Diagonal Beam -->
  <polygon points="0,0 260,0 480,450 0,450" fill="url(#ambientLight)" opacity="0.4" />
</svg>
