<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="60%" stop-color="#ECE7DC" />
      <stop offset="100%" stop-color="#DDD6C7" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EADBCE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="buildingConcrete1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4DFD5" />
      <stop offset="100%" stop-color="#D5CFC3" />
    </linearGradient>
    <linearGradient id="buildingConcrete2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD7CB" />
      <stop offset="100%" stop-color="#CBC4B5" />
    </linearGradient>
    <linearGradient id="woodWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8906D" />
      <stop offset="100%" stop-color="#A57A54" />
    </linearGradient>
    <linearGradient id="glassTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DA1A8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#556970" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2BCAD" />
      <stop offset="100%" stop-color="#A8A190" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyGrad)" />
  <circle cx="950" cy="180" r="280" fill="url(#sunGlow)" />

  <!-- Distant Hill Profiles -->
  <path d="M0 450 Q 280 320, 600 390 T 1200 360 L 1200 675 L 0 675 Z" fill="#D3CCC0" opacity="0.6" />
  <path d="M0 480 Q 400 370, 850 430 T 1200 410 L 1200 675 L 0 675 Z" fill="#C5BDAE" opacity="0.75" />

  <!-- Background Foliage & Trees -->
  <g fill="#7A8771" opacity="0.85">
    <ellipse cx="220" cy="460" rx="60" ry="85" />
    <ellipse cx="260" cy="450" rx="75" ry="95" />
    <ellipse cx="330" cy="470" rx="55" ry="75" />
    <ellipse cx="980" cy="440" rx="90" ry="110" />
    <ellipse cx="1060" cy="430" rx="80" ry="100" />
    <ellipse cx="1140" cy="450" rx="70" ry="90" />
  </g>

  <!-- Main Architectural Complex (Contemporary Residential Pavilions) -->
  <!-- Left Wing -->
  <polygon points="180,480 180,240 380,210 380,480" fill="url(#buildingConcrete1)" />
  <polygon points="380,210 490,250 490,500 380,480" fill="url(#buildingConcrete2)" />

  <!-- Windows & Louvers Left Wing -->
  <rect x="210" y="260" width="130" height="40" rx="4" fill="url(#glassTone)" />
  <line x1="210" y1="273" x2="340" y2="273" stroke="#FFF" stroke-width="1.5" opacity="0.6" />
  <line x1="210" y1="286" x2="340" y2="286" stroke="#FFF" stroke-width="1.5" opacity="0.6" />

  <rect x="210" y="325" width="130" height="45" rx="4" fill="url(#glassTone)" />
  <line x1="210" y1="340" x2="340" y2="340" stroke="#FFF" stroke-width="1.5" opacity="0.6" />
  <line x1="210" y1="355" x2="340" y2="355" stroke="#FFF" stroke-width="1.5" opacity="0.6" />

  <rect x="210" y="395" width="130" height="50" rx="4" fill="url(#glassTone)" />
  <line x1="210" y1="412" x2="340" y2="412" stroke="#FFF" stroke-width="1.5" opacity="0.6" />
  <line x1="210" y1="428" x2="340" y2="428" stroke="#FFF" stroke-width="1.5" opacity="0.6" />

  <!-- Timber Accents / Balcony on Left -->
  <rect x="375" y="265" width="105" height="12" fill="url(#woodWarm)" />
  <rect x="375" y="335" width="105" height="12" fill="url(#woodWarm)" />
  <rect x="375" y="405" width="105" height="12" fill="url(#woodWarm)" />

  <!-- Center Main Residential Block -->
  <polygon points="450,510 450,150 780,120 780,510" fill="#EAE6DE" />
  <polygon points="780,120 940,165 940,530 780,510" fill="#D3CCC0" />

  <!-- Roof overhang & architectural frame -->
  <polygon points="430,155 790,115 810,125 430,165" fill="#584F45" />
  <polygon points="790,115 960,160 960,170 810,125" fill="#443D36" />

  <!-- Floor 3 (Penthouse Balcony & Timber Louvers) -->
  <rect x="480" y="165" width="260" height="60" rx="4" fill="url(#glassTone)" />
  <rect x="490" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="520" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="550" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="580" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="610" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="640" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="670" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="700" y="165" width="6" height="60" fill="url(#woodWarm)" />
  <rect x="730" y="165" width="6" height="60" fill="url(#woodWarm)" />

  <!-- Balcony planter with lush green foliage -->
  <rect x="470" y="225" width="280" height="10" rx="3" fill="#B2A99B" />
  <path d="M475 227 Q500 215 530 226 Q570 212 610 225 Q660 214 700 226 Q730 216 750 227 Z" fill="#5F6F57" />

  <!-- Floor 2 Living Windows & Cantilever -->
  <rect x="480" y="260" width="260" height="70" rx="4" fill="url(#glassTone)" />
  <rect x="800" y="275" width="115" height="55" rx="3" fill="url(#glassTone)" />
  <rect x="470" y="330" width="280" height="12" rx="3" fill="#B2A99B" />
  <path d="M475 332 Q510 320 550 331 Q600 318 640 330 Q690 319 730 332 Q745 322 750 332 Z" fill="#697B60" />

  <!-- Floor 1 Ground Entry & Courtyard Terrace -->
  <rect x="480" y="365" width="110" height="85" rx="4" fill="url(#glassTone)" />
  <rect x="620" y="365" width="120" height="85" rx="4" fill="url(#glassTone)" />
  <rect x="800" y="375" width="115" height="75" rx="3" fill="url(#glassTone)" />

  <!-- Architectural Columns -->
  <rect x="600" y="360" width="12" height="140" fill="#BFB7A8" />
  <rect x="750" y="360" width="12" height="140" fill="#ABA293" />

  <!-- Right Wing -->
  <polygon points="910,210 1060,250 1060,530 910,500" fill="#E2DDD2" />
  <rect x="940" y="280" width="85" height="50" rx="3" fill="url(#glassTone)" />
  <rect x="940" y="365" width="85" height="60" rx="3" fill="url(#glassTone)" />

  <!-- Courtyard & Ground Plane -->
  <polygon points="0,520 1200,490 1200,675 0,675" fill="url(#groundGrad)" />
  <polygon points="320,530 880,505 950,675 220,675" fill="#D6CFBF" opacity="0.7" />

  <!-- Landscaped Gardens & Trees in Foreground -->
  <g fill="#57684E">
    <ellipse cx="140" cy="560" rx="90" ry="110" />
    <ellipse cx="210" cy="580" rx="70" ry="90" />
    <ellipse cx="70" cy="600" rx="75" ry="85" />
    <ellipse cx="1020" cy="550" rx="100" ry="120" />
    <ellipse cx="1120" cy="570" rx="80" ry="95" />
  </g>
  <g fill="#43523C">
    <ellipse cx="160" cy="620" rx="110" ry="70" />
    <ellipse cx="980" cy="610" rx="120" ry="75" />
    <ellipse cx="1090" cy="630" rx="90" ry="60" />
  </g>

  <!-- Paved walkway line -->
  <path d="M480 675 L560 525 L640 525 L720 675 Z" fill="#CCC5B5" opacity="0.8" />
  <line x1="480" y1="675" x2="560" y2="525" stroke="#B8B09F" stroke-width="2" />
  <line x1="720" y1="675" x2="640" y2="525" stroke="#B8B09F" stroke-width="2" />
</svg>
